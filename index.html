<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Reading List</h1>
    <p id="intro">Books for Miona and Sena</p>

    <form id="add-form" aria-label="Add a book">
      <label for="title">Title</label>
      <input type="text" id="title" required>

      <label for="author">Author</label>
      <input type="text" id="author">

      <label for="reader">Reader</label>
      <select id="reader">
        <option value="me">Miona</option>
        <option value="daughter">Sena</option>
      </select>

      <label for="ownership">Ownership</label>
      <select id="ownership">
        <option value="owned">Owned</option>
        <option value="borrowed">Borrowed</option>
        <option value="library">Library</option>
      </select>

      <button type="submit">Add book</button>
    </form>

    <div id="tabs" role="group" aria-label="Show books for">
      <button type="button" data-reader="all">All</button>
      <button type="button" data-reader="me">Miona</button>
      <button type="button" data-reader="daughter">Sena</button>
    </div>

    <ul id="book-list"></ul>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form">
      <h2 id="edit-heading">Edit book</h2>

      <label for="edit-title">Title</label>
      <input type="text" id="edit-title" required>

      <label for="edit-author">Author</label>
      <input type="text" id="edit-author">

      <label for="edit-reader">Reader</label>
      <select id="edit-reader"></select>

      <label for="edit-ownership">Ownership</label>
      <select id="edit-ownership"></select>

      <label for="edit-status">Status</label>
      <select id="edit-status"></select>

      <div id="edit-start-row" class="date-row" hidden>
        <label for="edit-start">Start date</label>
        <input type="date" id="edit-start">
      </div>

      <div id="edit-end-row" class="date-row" hidden>
        <label for="edit-end">End date</label>
        <input type="date" id="edit-end">
      </div>

      <div id="edit-rating-row" hidden>
        <span id="edit-rating-label" class="field-label">Rating</span>
        <div id="edit-rating" class="rating" role="group" aria-labelledby="edit-rating-label"></div>
      </div>

      <div>
        <button type="button" id="edit-note">Add note</button>
      </div>

      <div class="dialog-buttons">
        <button type="button" id="edit-remove">Remove</button>
        <button type="button" id="edit-cancel">Cancel</button>
        <button type="submit" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="note-dialog" aria-labelledby="note-heading">
    <form id="note-form">
      <h2 id="note-heading">Note</h2>

      <p id="note-text"></p>

      <div id="note-input-row" class="date-row" hidden>
        <label for="note-input">Note (up to 200 characters)</label>
        <textarea id="note-input" maxlength="200" rows="4"></textarea>
      </div>

      <div class="dialog-buttons">
        <button type="button" id="note-cancel">Close</button>
        <button type="submit" id="note-save" hidden>Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
