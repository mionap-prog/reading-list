<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Reading List</h1>
    <p id="intro">Books for Miona and Sena</p>

    <form id="add-form">
      <label for="title">Title</label>
      <input type="text" id="title" required>

      <label for="author">Author</label>
      <input type="text" id="author">

      <label for="reader">Reader</label>
      <select id="reader">
        <option value="me">Miona</option>
        <option value="daughter">Sena</option>
      </select>

      <label for="ownership">Ownership</label>
      <select id="ownership">
        <option value="owned">Owned</option>
        <option value="borrowed">Borrowed</option>
        <option value="library">Library</option>
      </select>

      <button type="submit">Add book</button>
    </form>

    <div id="tabs" role="tablist" aria-label="Show books for">
      <button type="button" role="tab" data-reader="all">All</button>
      <button type="button" role="tab" data-reader="me">Miona</button>
      <button type="button" role="tab" data-reader="daughter">Sena</button>
    </div>

    <ul id="book-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
